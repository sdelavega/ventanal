[platformio]
src_dir = .
default_envs = normal
extra_configs = platformio.local*.ini

[lcd43b]
version = 1.2.0
restart_in_vsync = n
diag_variant = diag
lit_write_flags =
    -DVENTANAL_LCD_LIT_NVS=1
    -DVENTANAL_LCD_LIT_CACHE=1
    -DVENTANAL_LCD_LIT_CONFIRM=1
private_flags =

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp> +<*.S> +<src/miniz/miniz_tinfl.c>
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags =
    -DVENTANAL_FIRMWARE_VERSION=\"${lcd43b.version}\"
    -Wl,--wrap=esp_intr_alloc_intrstatus
    -Wl,--wrap=lwip_socket
    -Wl,--wrap=lwip_connect
    -Wl,--wrap=lwip_select
    -Wl,--wrap=lwip_getsockopt
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${lcd43b.private_flags}
custom_sdkconfig =
    CONFIG_APP_PROJECT_VER_FROM_CONFIG=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=${lcd43b.restart_in_vsync}
    CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
    CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    ; Keep the Arduino qio_opi defaults that the hybrid template overrides.
    CONFIG_SPIRAM_BOOT_HW_INIT=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_MEMTEST=n
    CONFIG_IDF_EXPERIMENTAL_FEATURES=n
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=32
    CONFIG_ESP_WIFI_RX_BA_WIN=6
    CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
    ; TLS buffers live in PSRAM: Wi-Fi off/on across light sleep fragments
    ; internal RAM until mbedtls_ssl_setup fails (-0x7F00) with ~70 KB free.
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n

[env:normal]
build_flags =
    ${env.build_flags}
    ${lcd43b.lit_write_flags}
custom_sdkconfig =
    ${env.custom_sdkconfig}
    CONFIG_APP_PROJECT_VER="${lcd43b.version}"

; The public fixture key is for local bench OTA only.
[env:bench]
custom_sdkconfig =
    ${env.custom_sdkconfig}
    CONFIG_APP_PROJECT_VER="${lcd43b.version}-bench"
build_flags =
    ${env.build_flags}
    ${lcd43b.lit_write_flags}
    -DVENTANAL_ALLOW_TEST_KEY=1

; Diagnostics keep ScanoutSavePause and test lit writes through probeLitWrites.
[env:diag]
custom_sdkconfig =
    ${env.custom_sdkconfig}
    CONFIG_APP_PROJECT_VER="${lcd43b.version}-${lcd43b.diag_variant}"
build_flags =
    ${env.build_flags}
    -DVENTANAL_ALLOW_TEST_KEY=1
    -DVENTANAL_LCD_DIAG_PANEL=1
    -DVENTANAL_LCD_DIAG_F3=1
    -DVENTANAL_LCD_DIAG_OTA=1

[env:diag-dim]
extends = env:diag
custom_sdkconfig =
    ${env.custom_sdkconfig}
    CONFIG_APP_PROJECT_VER="${lcd43b.version}-diag-dim"
build_flags =
    ${env:diag.build_flags}
    -DVENTANAL_LCD_DIAG_DIM=1

