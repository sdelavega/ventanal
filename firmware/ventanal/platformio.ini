[platformio]
src_dir = .
default_envs = normal
extra_configs = platformio.local*.ini

[inkplate]
private_flags =
diag_flags =

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = inkplate13spectra
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<*.cpp>
extra_scripts =
    pre:pio_config.py
    pre:pio_variant.py
    post:pio_flash_images.py
; InkplateLibrary 11.2.1 and ArduinoJson 7.4.3.
lib_deps =
    https://github.com/SolderedElectronics/Inkplate-Arduino-library/archive/3c15d3275bb3b5c0d4b0ea8d79d87a8380a94554.zip
    bblanchon/ArduinoJson@7.4.3
build_flags =
    ${inkplate.private_flags}
custom_sdkconfig =
    CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
    ; Restore the Arduino opi_opi settings overridden by the hybrid template.
    CONFIG_SPIRAM_BOOT_HW_INIT=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_MEMTEST=n
    CONFIG_IDF_EXPERIMENTAL_FEATURES=n
    ; Keep the Soldered core's Wi-Fi allocation and receive window.
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_RX_BA_WIN=8
    CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
    CONFIG_LWIP_IPV6_ND6_ROUTE_INFO_OPTION_SUPPORT=n

[env:normal]

[env:bench]
build_flags =
    ${env.build_flags}
    -DVENTANAL_ALLOW_TEST_KEY=1

[env:diag]
build_flags =
    ${env.build_flags}
    -DVENTANAL_OTA_GITHUB=1
    ${inkplate.diag_flags}
