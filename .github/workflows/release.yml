name: Draft firmware release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install hash-pinned release tooling
        run: python -m pip install --require-hashes --only-binary=:all: -r tools/release/requirements-platformio.txt
      - name: Build unsigned OTA assets
        env:
          PYTHONPATH: server/src
        run: python tools/release/build.py "${GITHUB_REF_NAME#v}" --output build/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-release-assets
          path: build/release-assets/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: firmware-release-assets
          path: release-assets
      - name: Attach unsigned assets to a new draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.bin release-assets/*.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
